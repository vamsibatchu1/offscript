      <stop offset="0.12" stop-color="#f5f1e3" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#f5f1e3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e9e2cc" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
