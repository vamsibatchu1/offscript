<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="1538" viewBox="0 0 1182 1538">
  <title>Green engineering paper</title>
  <desc>A softly aged cream sheet with a numbered green 18 by 24 grid, five subdivisions per square, three punched holes, and faint horizontal rules.</desc>
  <defs>
    <filter id="fiber-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.82 0.64" numOctaves="3" seed="24" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="faded-rules" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
