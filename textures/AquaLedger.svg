<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="1544" viewBox="0 0 1210 1544">
  <title>Aqua ledger paper</title>
  <desc>Softly grained paper with alternating pale aqua and warm-white bands, fine green horizontal ruling, and a double dotted margin near the right edge.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.78 0.72" numOctaves="3" seed="38" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="printed-ink" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.2"/>
    </filter>
  </defs>
